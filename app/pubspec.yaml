name: kalacart
description: "KalaCart - AI-powered handicraft commerce platform for Indian artisans"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.3
  dio: ^5.7.0
  http_parser: ^4.0.2
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
