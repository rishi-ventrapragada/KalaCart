# Render Blueprint for the KalaCart FastAPI backend.
#
# Secrets are NOT here. Every value below is non-sensitive. The four secrets
# (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_KEY, OPENROUTER_API_KEY)
# are marked sync:false, which tells Render to prompt for them in the dashboard
# and keep them out of this file and out of git.
#
# Render's filesystem is ephemeral and is wiped on every spin-down, so nothing
# may be persisted to disk. This backend already stores uploads in Supabase
# Storage, so that is fine -- but it is why secrets must be env vars, never
# baked into the image.

services:
  - type: web
    name: kalacart-api
    runtime: docker
    # Docker rather than Render's native Python runtime: the Dockerfile pins
    # Python 3.11, which is what the image is tested against. The native runtime
    # would pick its own Python (the dev machine runs 3.13), silently changing
    # the interpreter under a suite that currently passes 863 tests.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free           # 0.1 CPU / 512 MB, 750 instance-hours per month
    region: singapore    # closest Render region to India; Mumbai is not offered
    branch: master
    healthCheckPath: /api/v1/health

    envVars:
      - key: APP_ENV
        value: production

      # Must stay false. core/security.py:_is_debug_mock_allowed() returns True
      # when DEBUG=true OR APP_ENV != production, and in that state the backend
      # decodes bearer tokens WITHOUT verifying signatures and fabricates user
      # ids. On a public URL that is an open door. Never flip this to debug a
      # production issue.
      - key: DEBUG
        value: "false"

      # Render's documented default port for web services.
      - key: PORT
        value: "10000"

      - key: API_V1_PREFIX
        value: /api/v1

      # CORS is a browser policy: the Flutter app sends no Origin header and is
      # unaffected by this list. It governs only the React web admin, which is
      # not deployed yet -- add its origin when it is. Comma-separated or JSON
      # both parse (app/core/config.py, CORS_ORIGINS property).
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:5173

      # Generated by Render, 32+ chars. Startup RAISES in production if this is
      # left at the insecure default (core/config.py validate_secret_key_or_warn).
      - key: SECRET_KEY
        generateValue: true

      # sync:false => Render prompts for these in the dashboard and stores them
      # encrypted. They are never written to this file or committed.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
